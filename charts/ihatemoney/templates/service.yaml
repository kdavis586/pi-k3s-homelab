apiVersion: v1
kind: Service
metadata:
  name: ihatemoney
  namespace: ihatemoney
  labels:
    {{- include "ihatemoney.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ihatemoney.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
