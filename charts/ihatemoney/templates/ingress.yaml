apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ihatemoney
  namespace: ihatemoney
  labels:
    {{- include "ihatemoney.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: ihatemoney
          port: 8000
