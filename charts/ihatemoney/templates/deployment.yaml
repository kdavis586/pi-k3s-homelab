apiVersion: apps/v1
kind: Deployment
metadata:
  name: ihatemoney
  namespace: ihatemoney
  labels:
    {{- include "ihatemoney.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.enabled }}1{{ else }}0{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ihatemoney.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ihatemoney.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      initContainers:
        # Prevent a pod from silently writing data to apple-pi's root disk if
        # the USB volume is unavailable during a reboot or maintenance.
        - name: wait-for-usb
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              until grep -q ' /mnt/usb-storage ' /host-proc/mounts; do
                echo "Waiting for USB storage to be mounted..."
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: host-proc-mounts
              mountPath: /host-proc/mounts
              readOnly: true
      containers:
        - name: ihatemoney
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DEBUG
              value: "False"
            - name: ACTIVATE_DEMO_PROJECT
              value: "False"
            - name: ACTIVATE_ADMIN_DASHBOARD
              value: "False"
            # I Hate Money writes this into a Python config file, which needs
            # Python rather than YAML boolean spelling.
            - name: ALLOW_PUBLIC_PROJECT_CREATION
              value: {{ if .Values.security.allowPublicProjectCreation }}"True"{{ else }}"False"{{ end }}
            - name: SESSION_COOKIE_SECURE
              value: "False"
            # Traffic is private LAN HTTP; this unique value protects Flask sessions.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ihatemoney-runtime
                  key: secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /database
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ihatemoney-data
        - name: host-proc-mounts
          hostPath:
            path: /proc/mounts
            type: File
