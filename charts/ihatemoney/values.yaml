# Set to true to run the application. When false, Flux retains the chart and
# durable USB-backed data but scales the workload to zero.
enabled: false

image:
  repository: ihatemoney/ihatemoney
  # v7.2.1 multi-architecture image, pinned by manifest digest.
  digest: sha256:009d1520552782765c8c41750262cc69410be7ac616f93a9f371556e472f23c6
  pullPolicy: IfNotPresent

nodeSelector:
  kubernetes.io/hostname: apple-pi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

storage:
  size: 1Gi
  # Application data is deliberately stored outside K3s's local-path
  # provisioner, on the durable USB volume mounted on apple-pi.
  hostPath: /mnt/usb-storage/ihatemoney

# This is reachable only on the private LAN through Traefik.
ingress:
  host: expenses.internal
  # Direct LAN fallback for clients that are not using Pi-hole DNS.
  ip: "192.168.1.100"

security:
  # Project creation is intentionally LAN-only. Once the initial project has
  # been created, change this to false and configure an administrator secret.
  allowPublicProjectCreation: true
